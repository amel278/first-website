    <h1>Salju</h1>

    <p>Salju adalah bentuk padat air atau presipitasi berupa kristal es lembut berwarna putih bagaikan kapas. Salju terbentuk di awan saat suhu udara berada di bawah titik beku 0° Celsius (32° Fahrenheit), membuat uap air langsung berubah menjadi es lalu jatuh ke bumi.</p>
